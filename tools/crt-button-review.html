<div id="luna-crt-review">
  <style>
    #luna-crt-review .inspection {display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:20px 12px;margin-top:20px}
    #luna-crt-review figure {margin:0;min-width:0}
    #luna-crt-review figcaption {margin-bottom:8px;color:var(--foreground);font-size:14px}
    #luna-crt-review .pair {display:flex;flex-direction:column;gap:9px}
    #luna-crt-review .sample {display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
    #luna-crt-review .sample span {color:var(--muted-foreground);font-size:12px}
    #luna-crt-review .asset {display:flex;justify-content:center;align-items:center;width:82px;min-height:28px;flex-shrink:0}
    #luna-crt-review img {image-rendering:pixelated;display:block}
  </style>
  <div class="viz-controls">
    <label class="form-label" for="luna-crt-scale">Inspection scale</label>
    <select class="form-select" id="luna-crt-scale"><option value="1">1x · native pixels</option><option value="2" selected>2x · inspect edges</option><option value="3">3x · inspect edges</option></select>
    <label class="form-check"><input class="form-check-input" id="luna-crt-soft" type="checkbox"><span class="form-check-label">Soften edges · approximation</span></label>
  </div>
  <div class="inspection" aria-label="Current and proposed LUNA controller icons"></div>
  <div class="text-small text-muted" aria-live="polite" style="margin-top:18px" data-result>2x raster inspection</div>
  <script>
    (() => {
      const root = document.getElementById('luna-crt-review');
      const data = /*ASSET_DATA*/{};
      const scale = root.querySelector('#luna-crt-scale');
      const soft = root.querySelector('#luna-crt-soft');
      const inspection = root.querySelector('.inspection');
      const result = root.querySelector('[data-result]');
      for (const name of Object.keys(data.sizes)) {
        const figure = document.createElement('figure');
        const caption = document.createElement('figcaption');
        caption.textContent = name === 'dpad' ? 'D-pad' : name.toUpperCase();
        figure.appendChild(caption);
        const pair = document.createElement('div'); pair.className = 'pair';
        for (const [key,label] of [['before','Current'],['after','Proposed']]) {
          const row = document.createElement('div'); row.className = 'sample';
          const text = document.createElement('span'); text.textContent = label;
          const box = document.createElement('div'); box.className = 'asset';
          const image = document.createElement('img');
          image.src = data[key][name]; image.alt = label + ' ' + name + ' icon';
          image.dataset.name = name;
          box.appendChild(image); row.append(text,box); pair.appendChild(row);
        }
        figure.appendChild(pair); inspection.appendChild(figure);
      }
      function apply(state) {
        if (!state) return;
        if ([1,2,3].includes(Number(state.scale))) scale.value = String(state.scale);
        if (typeof state.soft === 'boolean') soft.checked = state.soft;
      }
      function draw() {
        for (const image of inspection.querySelectorAll('img')) {
          const [w,h] = data.sizes[image.dataset.name];
          image.width = w * Number(scale.value); image.height = h * Number(scale.value);
          image.style.filter = soft.checked ? `blur(${0.35 * Number(scale.value)}px)` : 'none';
        }
        result.textContent = scale.value + 'x raster inspection' + (soft.checked ? ' · edge softening approximation; no interlace or CRT emulation' : '');
      }
      function change() {
        draw();
        if (window.openai && window.openai.setWidgetState)
          window.openai.setWidgetState({modelContent:{scale:Number(scale.value),soft:soft.checked}}).catch(() => {});
      }
      apply(window.openai && window.openai.widgetState && window.openai.widgetState.modelContent);
      scale.addEventListener('change',change); soft.addEventListener('change',change);
      window.addEventListener('openai:set_globals',event => {
        const state = event.detail && event.detail.globals && event.detail.globals.widgetState;
        apply(state && state.modelContent); draw();
      });
      draw();
    })();
  </script>
</div>
